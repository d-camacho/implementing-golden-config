---
_metadata:
  name: "NYC Config Context"
  weight: 2000
  description: "Config Context for all NYC Devices"
  is_active: true

ntp:
  servers:
    - ip: "192.168.1.1"
      prefer: true
    - ip: "172.16.2.22"

snmp:
  communities:
    - name: "nyc-snmp-ro"
      ro: true
  location: "New York, NY - NYC DC1"
  contact: "NYC Network Operations <nyc-noc@demo.local>"

acl_regional:
  - name: "MULTICAST-FILTER"
    type: "extended"
    entries:
      - sequence: 10
        action: "permit"
        protocol: "ip"
        src:
          type: "any"
        dst:
          type: "network"
          address: "239.20.1.0"
          wildcard: "0.0.0.255"
      - sequence: 20
        action: "deny"
        protocol: "ip"
        src:
          type: "any"
        dst:
          type: "network"
          address: "224.20.1.0"
          wildcard: "0.0.0.255"
      - sequence: 30
        action: "permit"
        protocol: "ip"
        src:
          type: "any"
        dst:
          type: "any"
